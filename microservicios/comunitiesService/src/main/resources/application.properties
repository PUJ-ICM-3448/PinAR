spring.application.name=comunitiesService

# Sobrescribe con credenciales locales (no se sube a git):
# copia application-local.properties.example → application-local.properties
spring.config.import=optional:classpath:application-local.properties

# Redis Cloud / Redis remoto (feed)
# Variables de entorno:
#   REDIS_HOST          — endpoint público (ej. xxx.db.redis.io)
#   REDIS_PORT          — puerto del endpoint
#   REDIS_PASSWORD      — contraseña del usuario default en Redis Cloud
#   REDIS_USERNAME      — por defecto "default" (requerido en Redis Cloud con ACL)
#   REDIS_SSL_ENABLED   — "true" solo si en Redis Cloud usas el endpoint/puerto TLS
#   REDIS_URL           — opcional: rediss://default:password@host:port (sobrescribe host/port/ssl)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=${REDIS_TIMEOUT:10s}
